<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mandal Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{width:min(1100px,92%);margin:40px auto}.panel{padding:30px;border:1px solid var(--border);border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form input,.form textarea{padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface-solid);color:var(--text)}.form textarea,.full{grid-column:1/-1}.list{margin-top:30px;display:grid;gap:12px}.item{padding:16px;border:1px solid var(--border);border-radius:16px;display:flex;justify-content:space-between;background:var(--surface-solid)}@media(max-width:700px){.form{grid-template-columns:1fr}.form textarea,.full{grid-column:auto}.item{display:block}}</style></head><body><div class="admin"><div class="panel"><div class="festival-badge">ADMIN PANEL</div><h1>Mandal Management</h1><div id="login"><div class="form"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="primary-button full" onclick="login()">Login</button></div></div><div id="dash" style="display:none"><div class="form"><input id="name" placeholder="Mandal name"><input id="location" placeholder="Location"><input id="address" placeholder="Address"><input id="lat" type="number" step="any" placeholder="Latitude"><input id="lng" type="number" step="any" placeholder="Longitude"><input id="category" placeholder="Category"><input id="time" placeholder="Darshan timings"><input id="year" type="number" value="2027"><input id="image" class="full" placeholder="Photo URL"><textarea id="desc" placeholder="Description"></textarea><input id="instagram" placeholder="Instagram URL"><input id="youtube" placeholder="YouTube URL"><input id="facebook" placeholder="Facebook URL"><input id="whatsapp" placeholder="WhatsApp URL"><button class="primary-button" onclick="save()">Save Mandal</button><button class="secondary-button" onclick="clearForm()">Clear</button></div><div class="list" id="list"></div></div></div></div><script src="/admin.js"></script></body></html>
